<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Admin Panel</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --border-color: #334155;
            --accent: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .session-list {
            flex-grow: 1;
            overflow-y: auto;
        }
        .session-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .session-item:hover, .session-item.active {
            background: rgba(59, 130, 246, 0.2);
        }
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        .chat-messages {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-msg {
            max-width: 70%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            line-height: 1.4;
        }
        .chat-msg.customer {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-msg.admin {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .msg-sender {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            font-weight: bold;
        }
        .chat-msg.admin .msg-sender {
            color: rgba(255,255,255,0.8);
        }
        .chat-input-area {
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }
        .chat-input-area input {
            flex-grow: 1;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: white;
            font-size: 1rem;
        }
        .chat-input-area button {
            padding: 0 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .login-box {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="admin-username" placeholder="Enter Admin Username" style="padding: 0.8rem; border-radius: 4px; border: 1px solid #334155; margin-bottom: 1rem; width: 250px;">
            <br>
            <input type="password" id="admin-password" placeholder="Enter Admin Password" style="padding: 0.8rem; border-radius: 4px; border: 1px solid #334155; margin-bottom: 1rem; width: 250px;">
            <br>
            <button onclick="login()" style="padding: 0.8rem 2rem; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="sidebar">
        <div class="header">Active Chats</div>
        <div class="session-list" id="session-list">
            <!-- Sessions injected via JS -->
        </div>
    </div>
    
    <div class="chat-area" id="chat-area" style="display: none;">
        <div class="header" id="current-chat-header">Select a chat</div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages injected via JS -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your reply...">
            <button id="chat-send-btn">Send</button>
        </div>
    </div>

    <script>
        // Use relative URL so it works locally and on Render
        const API_BASE_URL = window.location.origin;
        let adminUsername = '';
        let adminPassword = '';
        let currentSessionId = null;
        let chatPollInterval = null;

        function login() {
            const user = document.getElementById('admin-username').value;
            const pass = document.getElementById('admin-password').value;
            if(!user || !pass) return;
            
            adminUsername = user;
            adminPassword = pass;
            document.getElementById('login-overlay').style.display = 'none';
            
            // Start polling sessions
            loadSessions();
            setInterval(loadSessions, 5000);
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE_URL}/admin/chats`, {
                    headers: { 
                        'x-admin-username': adminUsername,
                        'x-admin-password': adminPassword 
                    }
                });
                
                if (res.status === 401) {
                    alert("Wrong Username or Password");
                    document.getElementById('login-overlay').style.display = 'flex';
                    return;
                }

                const sessions = await res.json();
                renderSessions(sessions);
            } catch (err) {
                console.error("Failed to load sessions", err);
            }
        }

        function renderSessions(sessions) {
            const list = document.getElementById('session-list');
            if(sessions.length === 0) {
                list.innerHTML = '<p style="padding: 1rem; color: #94a3b8;">No active chats.</p>';
                return;
            }

            let html = '';
            sessions.forEach(s => {
                const lastMsg = s.messages.length > 0 ? s.messages[s.messages.length-1].text : 'No messages';
                const date = new Date(s.lastActive).toLocaleTimeString();
                html += `
                    <div class="session-item ${currentSessionId === s.sessionId ? 'active' : ''}" onclick="selectChat('${s.sessionId}', '${s.name}')">
                        <div style="font-weight: bold; margin-bottom: 0.2rem;">${s.name}</div>
                        <div style="font-size: 0.8rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${lastMsg}</div>
                        <div style="font-size: 0.7rem; color: #64748b; margin-top: 0.2rem;">Last active: ${date}</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function selectChat(sessionId, name) {
            currentSessionId = sessionId;
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('current-chat-header').textContent = `Chatting with: ${name}`;
            
            // Load messages
            loadMessages();
            
            // Start polling for this specific chat
            clearInterval(chatPollInterval);
            chatPollInterval = setInterval(loadMessages, 3000);
        }

        async function loadMessages() {
            if(!currentSessionId) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/chat/${currentSessionId}`);
                const data = await res.json();
                renderMessages(data.messages);
            } catch(e) {
                console.error("Failed to load messages", e);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = messages.map(m => `
                <div class="chat-msg ${m.isAdmin ? 'admin' : 'customer'}">
                    <div class="msg-sender">${m.sender}</div>
                    ${m.text}
                </div>
            `).join('');
            
            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !currentSessionId) return;

            input.value = '';

            try {
                await fetch(`${API_BASE_URL}/api/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: currentSessionId,
                        text: text,
                        isAdmin: true
                    })
                });
                loadMessages();
            } catch(e) {
                console.error("Failed to send message", e);
            }
        }
    </script>
</body>
</html>
